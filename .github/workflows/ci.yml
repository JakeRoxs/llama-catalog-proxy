name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd/llama-catalog-proxy/*.go ./internal/*/*.go)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: Test with race detector
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: llama-catalog-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z

  sonar-analysis:
    name: SonarQube analysis
    if: (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'pull_request' &&
      github.base_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    env:
      SONAR_USER_HOME: ${{ github.workspace }}/.sonar

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version=$(git describe --tags --always --dirty 2>/dev/null || echo "ci-${{ github.run_id }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restore the newest accessible snapshot; the content hash is known only after scanning.
      - name: Restore SonarScanner downloads
        id: sonar-cache
        uses: actions/cache/restore@v5
        with:
          path: .sonar/cache
          key: sonar-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_VERSION: ${{ steps.version.outputs.version }}

      # Caches are immutable: save a new snapshot only when the cached files change.
      - name: Save SonarScanner downloads
        if: >-
          ${{ hashFiles('.sonar/cache/**') != '' &&
              format('sonar-downloads-v1-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('.sonar/cache/**')) !=
              steps.sonar-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v5
        with:
          path: .sonar/cache
          key: sonar-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.sonar/cache/**') }}
