services:
  llama-catalog-proxy:
    image: ghcr.io/jakeroxs/llama-catalog-proxy:${LLAMA_CATALOG_PROXY_TAG:-latest}
    container_name: llama-catalog-proxy
    profiles: ["ai", "all"]
    restart: unless-stopped
    networks:
      - udms_default
    ports:
      - "${LLAMA_CATALOG_PROXY_PORT:-9292}:8080"
    environment:
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/llama-catalog-proxy/:/config:ro
    command:
      - "--config"
      - "/config/config.yaml"
    healthcheck:
      test: ["CMD", "/llama-catalog-proxy", "--healthcheck", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  udms_default:
    external: true
    name: docker_default
