listen: 0.0.0.0:8080
log_level: INFO

default_backend: default
backends:
  default:
    url: http://openai-backend-default:8080
    prefix: ""
    # api_key: replace-with-default-api-key
  gpu:
    url: http://openai-backend-gpu:8080
    prefix: gpu/
    # api_key: replace-with-gpu-api-key
    # health_path: /api/version
    # ollama_show_enrichment: true
    # diagnostics: llama_swap # opt-in metadata probes via --diagnostics; no background polling
    # headers:
    #   X-Custom-Backend-Header: value

path_routes:
  /comfyui: gpu

# Wait for active ComfyUI queue jobs before forwarding inference requests to
# other backends. Requires path_routes /comfyui. Timeout returns HTTP 504.
# comfyui_wait_timeout: 45m

models_cache_ttl: 15s
request_timeout: 10s
# health_timeout: 2s   # inherits request_timeout when omitted
# catalog_timeout: 20s # inherits request_timeout when omitted
max_json_request_body_bytes: 67108864
# Opt-in proxy history and on-demand --diagnostics activity/identity/GPU/readiness reports (default off).
# Metadata reads additionally require diagnostics: llama_swap on the backend.
request_history: false

# Dedicated API key protecting the internal /diagnostics and /diagnostics/v1
# endpoints. Empty (default) disables the diagnostics API. When set, requests
# to those paths require the key; the key is never logged or returned in
# responses. Must not contain control characters and is capped at 4096 bytes.
# diagnostics_api_key: replace-with-diagnostics-api-key

# Opt-in per-request inference timing observation for POST generation paths
# (default off). When enabled, request_observation logs are emitted with
# request_id, backend_id and a bounded summary; no path, model, body, header
# or error strings are included.
request_observation: false
